function ask(title,msg,ok,fn){const d=$("#dlg");d.innerHTML=`<h2 id="dt">${esc(title)}</h2><p>${esc(msg)}</p><div class="row"><button class="btn g" id="no" type="button">Cancel</button><button class="btn d" id="ok" type="button">${ok}</button></div>`;d.showModal();$("#no").onclick=()=>d.close();$("#ok").onclick=()=>{d.close();fn()}}
function setPage(b,v){b.cur=v;if(v>=b.total){b.status="Completed";b.fin=b.fin||today()}else{if(v>0&&(b.status==="Want to Read"||b.status==="On Hold"||b.status==="Completed"))b.status="Currently Reading";if(b.status!=="Completed")b.fin=""}}
function pageInputs(){$$("[data-p]").forEach(i=>i.onchange=()=>{const b=bks().find(x=>x.id==i.dataset.p),v=Number(i.value);if(i.value===""||!Number.isInteger(v)||v<0||v>b.total){i.value=b.cur;return toast(`Enter a whole page number from 0 to ${b.total}. It cannot be higher than the total pages.`)}
setPage(b,v);save();toast(`Progress saved: ${pct(b)}% of “${b.title}”${b.status==="Completed"?". Marked as Completed":""}`);refresh()})}
function del(id){const i=bks().findIndex(b=>b.id===id),b=bks()[i];ask("Delete this book?",`“${b.title}” will be removed from your library. You can undo right after.`,"Delete",()=>{bks().splice(i,1);save();refresh();toast(`Deleted “${b.title}”`,()=>{bks().splice(Math.min(i,bks().length),0,b);save();refresh();toast(`Restored “${b.title}”`)})})}

/* ---------- charts ---------- */
function donut(items){const tot=items.reduce((s,i)=>s+i.n,0),R=54,L=2*Math.PI*R;let a=0;
return`<svg viewBox="0 0 140 140" width="170" height="170" role="img" aria-label="Status distribution: ${items.map(i=>i.l+" "+i.n).join(", ")}"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#ece6da" stroke-width="22"/>`+items.filter(i=>i.n).map(i=>{const l=i.n/tot*L,s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${i.c}" stroke-width="22" stroke-dasharray="${l} ${L-l}" stroke-dashoffset="${-a}" transform="rotate(-90 70 70)"/>`;a+=l;return s}).join("")+`<text x="70" y="70" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">${tot}</text><text x="70" y="88" text-anchor="middle" font-size="11" fill="#586178">books</text></svg>`}
function vbars(items){const mx=Math.max(1,...items.map(i=>i.n)),w=360/items.length;return`<svg viewBox="0 0 360 190" role="img" aria-label="Books completed per month: ${items.map(i=>i.l+" "+i.n).join(", ")}" style="width:100%;max-height:230px">`+items.map((i,k)=>{const h=i.n/mx*120,x=k*w+w*.2;return`<rect x="${x}" y="${150-h}" width="${w*.6}" height="${h}" rx="6" fill="#2f7656"/><text x="${x+w*.3}" y="${143-h}" text-anchor="middle" font-size="13" font-weight="700" fill="#14213d">${i.n}</text><text x="${x+w*.3}" y="172" text-anchor="middle" font-size="12" fill="#586178">${i.l}</text>`}).join("")+`<line x1="0" y1="150" x2="360" y2="150" stroke="#e6dfd2"/></svg>`}
const SC=["#3d5f94","#c98a1b","#2f7656","#b42318","#6b7088"];

/* ---------- pages ---------- */
function overview(){const b=bks(),c=s=>b.filter(x=>x.status===s).length,tp=b.reduce((s,x)=>s+x.total,0),rp=b.reduce((s,x)=>s+x.cur,0),d=due(),smp=b.filter(x=>x.sample).length;
const K=[["Total books",b.length,"library"],["Currently reading",c("Currently Reading"),"book-open"],["Completed",c("Completed"),"circle-check"],["Want to read",c("Want to Read"),"bookmark"],["Backlogged",d.length,"history"],["Overall progress",(tp?Math.round(rp/tp*100):0)+"%","trending-up"]];
const mo=[];for(let i=5;i>=0;i--){const x=new Date();x.setDate(1);x.setMonth(x.getMonth()-i);const k=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");mo.push({l:x.toLocaleString("en-GB",{month:"short"}),n:b.filter(y=>y.fin&&y.fin.startsWith(k)).length})}
const comp=b.filter(x=>x.status==="Completed"),cc={};comp.forEach(x=>cc[x.cc]=(cc[x.cc]||0)+1);const top=Object.entries(cc).sort((a,z)=>z[1]-a[1])[0];
const cur=b.filter(x=>x.status==="Currently Reading"),rec=[...b].sort((x,y)=>y.added.localeCompare(x.added)||y.id-x.id).slice(0,4);
return`${smp?`<div class="alert" style="border-color:var(--b);background:var(--bs)"><span><strong>${smp} sample book${smp>1?"s":""}</strong> are included so you can explore. They are marked “Sample”. Remove them in Settings.</span></div>`:""}
<div class="kp">${K.map(k=>`<div class="card kpi"><span class="ico"><i data-lucide="${k[2]}"></i></span><div><b>${k[1]}</b><span>${k[0]}</span></div></div>`).join("")}</div>
<div class="g2"><div class="card"><h2>Reading activity</h2><p class="hint">Books completed in the last 6 months.</p>${vbars(mo)}</div>
<div class="card"><h2>Backlog alerts</h2>${d.length?`<p class="hint">Waiting longer than ${S.days} days.</p>`+d.slice(0,3).map(x=>`<div class="it">${cv(x,1)}<div><strong>${esc(x.title)}</strong><br><span class="hint">${wait(x)} days unread</span></div></div>`).join("")+`<p><a class="btn s" href="#review">Review ${d.length} book${d.length>1?"s":""}</a></p>`:`<div class="empty">No backlogged books. Nothing has waited longer than ${S.days} days.</div>`}</div></div>
<div class="g2"><div class="card"><h2>Currently reading</h2>${cur.length?cur.map(x=>`<div style="overflow:hidden;margin-bottom:.8rem">${cv(x,1)}<strong>${esc(x.title)}</strong> <span class="hint">${esc(x.author)}</span>${bar(x)}</div>`).join(""):`<div class="empty">Nothing in progress. Open My Books and start one.</div>`}</div>
<div class="card"><h2>Recently added</h2>${rec.length?rec.map(x=>`<div class="it">${cv(x,1)}<div><strong>${esc(x.title)}</strong><br><span class="hint">${esc(x.author)} · added ${fmt(x.added)}</span><br>${bdg(x.status)}</div></div>`).join(""):`<div class="empty">No books yet.</div>`}</div></div>
<div class="card"><h2>Global reading statistics</h2><div class="kp" style="margin:0"><div><b style="font:700 1.6rem Fraunces,serif">${Object.keys(cc).length}</b><br><span class="hint">countries explored</span></div><div><b style="font:700 1.6rem Fraunces,serif">${comp.length}</b><br><span class="hint">books completed</span></div><div><b style="font:700 1.6rem Fraunces,serif">${top?esc(N[top[0]]||top[0]):"–"}</b><br><span class="hint">most-read country${top?" ("+top[1]+")":""}</span></div></div><p><a class="btn s g" href="#map">Open the map</a></p></div>`}

function books(){return`<div class="tools" role="search"><div class="w"><label for="q">Search title or author</label><input id="q" type="search" value="${esc(f.q)}" autocomplete="off"></div>
<div><label for="fg">Category</label><select id="fg"><option>All</option>${G.map(g=>`<option${f.g===g?" selected":""}>${g}</option>`).join("")}</select></div>
<div><label for="fs">Status</label><select id="fs"><option>All</option>${ST.map(s=>`<option${f.st===s?" selected":""}>${s}</option>`).join("")}</select></div>
<div><label for="so">Sort by</label><select id="so">${[["title","Title"],["pct","Progress"],["rating","Rating"],["added","Date added"]].map(o=>`<option value="${o[0]}"${f.so===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select></div>
<div class="seg" role="group" aria-label="Layout"><button type="button" data-v="grid" aria-pressed="${f.view==="grid"}">Cards</button><button type="button" data-v="table" aria-pressed="${f.view==="table"}">Table</button></div>
<button class="btn g" id="reset" type="button">Reset filters</button><button class="btn" id="add" type="button"><i data-lucide="plus"></i>Add book</button></div>
<p class="st" id="cnt" role="status" aria-live="polite"></p><div id="res"></div>`}
function list(){const q=f.q.trim().toLowerCase();return bks().filter(b=>(f.st==="All"||b.status===f.st)&&(f.g==="All"||b.genre===f.g)&&(!q||(b.title+" "+b.author).toLowerCase().includes(q))).sort((a,b)=>f.so==="title"?a.title.localeCompare(b.title):f.so==="pct"?pct(b)-pct(a):f.so==="rating"?b.rating-a.rating:b.added.localeCompare(a.added))}
const acts=b=>`<button class="btn g s" data-e="${b.id}" type="button"><i data-lucide="pencil"></i>Edit</button><button class="btn dg s" data-x="${b.id}" type="button" aria-label="Delete ${esc(b.title)}"><i data-lucide="trash-2"></i>Delete</button>`;
function bk(){const r=list(),act=[f.q&&`“${f.q}”`,f.g!=="All"&&f.g,f.st!=="All"&&f.st].filter(Boolean);
$("#cnt").textContent=`Showing ${r.length} of ${bks().length} books · ${act.length?"Filters: "+act.join(", "):"No filters applied"}`;
$("#res").innerHTML=!r.length?`<div class="card empty"><h3>No books found</h3><p>Try a different search or reset the filters, or add a new book.</p></div>`:f.view==="grid"?`<div class="books">${r.map(b=>`<article class="card book">${cv(b)}<h3>${esc(b.title)}</h3><p class="hint">${esc(b.author)} · ${esc(nm(b.cc))} · ${esc(b.genre)}</p><p>${bdg(b.status)} ${b.sample?'<span class="tg">Sample</span>':""}</p><p>${stars(b.rating)}</p>${bar(b)}${planLine(b)?`<p class="hint">${planLine(b)}</p>`:""}<div class="row">${acts(b)}</div></article>`).join("")}</div>`
:`<div class="card tw"><table><thead><tr><th scope="col">Book</th><th scope="col">Author</th><th scope="col">Country</th><th scope="col">Category</th><th scope="col">Status</th><th scope="col">Progress</th><th scope="col">Actions</th></tr></thead><tbody>${r.map(b=>`<tr><td style="display:flex;align-items:center">${cv(b,1)}<strong>${esc(b.title)}</strong>${b.sample?' <span class="tg">Sample</span>':""}</td><td>${esc(b.author)}</td><td>${esc(nm(b.cc))}</td><td>${esc(b.genre)}</td><td>${bdg(b.status)}</td><td style="min-width:130px">${pct(b)}%<div class="pb"><i style="width:${pct(b)}%"></i></div></td><td><div class="row" style="margin:0">${acts(b)}</div></td></tr>`).join("")}</tbody></table></div>`;
$$("[data-e]").forEach(x=>x.onclick=()=>form(+x.dataset.e));$$("[data-x]").forEach(x=>x.onclick=()=>del(+x.dataset.x));ic()}
function bindBooks(){bk();const setF=(k,v)=>{f[k]=v;bk()};$("#q").oninput=e=>{f.q=e.target.value;$("#gs").value=f.q;bk()};$("#fg").onchange=e=>setF("g",e.target.value);$("#fs").onchange=e=>setF("st",e.target.value);$("#so").onchange=e=>setF("so",e.target.value);
$$("[data-v]").forEach(x=>x.onclick=()=>{f.view=x.dataset.v;$$("[data-v]").forEach(y=>y.setAttribute("aria-pressed",y===x));bk()});
$("#reset").onclick=()=>{f={...f,q:"",st:"All",g:"All",so:"title"};$("#gs").value="";render();toast("Filters cleared")};$("#add").onclick=()=>form()}

function progress(){const r=bks().filter(b=>ptab==="Completed"?b.status==="Completed":b.status!=="Completed");
return`<div class="tools"><div class="seg" role="group" aria-label="Book list"><button type="button" data-t="Unfinished" aria-pressed="${ptab==="Unfinished"}">Unfinished (${bks().filter(b=>b.status!=="Completed").length})</button><button type="button" data-t="Completed" aria-pressed="${ptab==="Completed"}">Completed (${bks().filter(b=>b.status==="Completed").length})</button></div></div>
${r.length?r.map(b=>`<article class="card book" style="margin-bottom:.8rem">${cv(b)}<h3>${esc(b.title)}</h3><p class="hint">${esc(b.author)}</p><p>${bdg(b.status)}</p>${bar(b)}
${b.status==="Completed"?`<p>${stars(b.rating)}</p><p class="hint">${b.notes?esc(b.notes.slice(0,160)):"No review written yet."}</p><div class="row"><button class="btn g s" data-e="${b.id}" type="button"><i data-lucide="pencil"></i>Edit rating and review</button></div>`:`<div class="row up"><label for="p${b.id}" style="margin:0">Current page</label><input id="p${b.id}" type="number" min="0" max="${b.total}" value="${b.cur}" data-p="${b.id}"><span class="hint">of ${b.total}. Press Tab or Enter to save.</span></div>`}</article>`).join(""):`<div class="card empty"><h3>${ptab==="Completed"?"No completed books yet":"Everything is finished"}</h3><p>${ptab==="Completed"?"Finish a book and it will appear here.":"Add a new book to keep reading."}</p></div>`}`}

function planner(){const r=bks().filter(b=>b.status!=="Completed"&&b.status!=="Abandoned");
return`<div class="card" style="margin-bottom:1rem"><h2>How the daily target works</h2><p class="hint">Remaining pages ÷ days from today (or your start date) to the target date, rounded up. Example: 300 pages in 15 days = 20 pages a day.</p></div>
${r.length?`<div class="books">${r.map(b=>`<article class="card book">${cv(b,1)}<h3>${esc(b.title)}</h3><p class="hint">${esc(b.author)}</p><p>${bdg(b.status)}</p>${b.start&&b.end?`<p class="hint">${fmt(b.start)} to ${fmt(b.end)}</p><p><strong>${planLine(b)}</strong></p>`:`<p class="hint">No reading plan yet.</p>`}<div class="row"><button class="btn s" data-pl="${b.id}" type="button"><i data-lucide="calendar-days"></i>${b.start?"Edit plan":"Set plan"}</button></div></article>`).join("")}</div>`:`<div class="card empty"><h3>No books to plan</h3><p>Add a book or change a status to start planning.</p></div>`}`}
function planForm(id){const b=bks().find(x=>x.id===id),d=$("#dlg");d.innerHTML=`<h2 id="dt">Reading plan: ${esc(b.title)}</h2><form id="pf" novalidate><p class="hint">${b.total-b.cur} pages left.</p><div class="fg"><div><label for="ps">Start date</label><input id="ps" type="date" value="${b.start||today()}"><div class="err" id="e-ps"></div></div><div><label for="pe">Target completion date</label><input id="pe" type="date" value="${b.end}"><div class="err" id="e-pe"></div></div></div><p class="hint" id="pv2" aria-live="polite"></p><div class="row"><button class="btn" type="submit">Save plan</button><button class="btn g" type="button" id="cn">Cancel</button>${b.start?'<button class="btn dg" type="button" id="rp">Remove plan</button>':""}</div></form>`;d.showModal();
const calc=()=>{const s=$("#ps").value,e=$("#pe").value;if(!s||!e||e<s)return $("#pv2").textContent="";const t=today(),n=dd(s>t?s:t,e)+1;$("#pv2").textContent=n<1?"":`Preview: ${Math.ceil((b.total-b.cur)/n)} pages a day for ${n} days.`};$("#ps").oninput=calc;$("#pe").oninput=calc;calc();
$("#cn").onclick=()=>d.close();if($("#rp"))$("#rp").onclick=()=>{b.start=b.end="";save();d.close();refresh();toast("Plan removed")};
$("#pf").onsubmit=e=>{e.preventDefault();const s=$("#ps").value,en=$("#pe").value,er={};if(!s)er.ps="Choose a start date.";if(!en)er.pe="Choose a target date.";else if(s&&en<s)er.pe="Target date must be on or after the start date.";else if(en<today())er.pe="Target date is in the past. Choose today or later.";
["ps","pe"].forEach(k=>{$("#e-"+k).textContent=er[k]||"";$("#"+k).setAttribute("aria-invalid",!!er[k])});if(Object.keys(er).length)return $("#"+Object.keys(er)[0]).focus();
b.start=s;b.end=en;save();d.close();refresh();toast(`Plan saved: ${planLine(b)}`)}}

function review(){const r=due().sort((a,b)=>wait(b)-wait(a));
return`<div class="card" style="margin-bottom:1rem"><p style="margin:0">Books on your “Want to Read” list for more than <strong>${S.days} days</strong> appear here. Change the limit in <a href="#settings">Settings</a>.</p></div>
${r.length?r.map(b=>`<article class="card book" style="margin-bottom:.8rem" data-b="${b.id}">${cv(b)}<h3>${esc(b.title)}</h3><p class="hint">${esc(b.author)}</p><p><strong>${wait(b)} days</strong> unread. Still want to read it?</p>
<div class="rev" style="clear:both"><div><label for="ns${b.id}">New status</label><select id="ns${b.id}"><option value="Currently Reading">Currently Reading</option><option value="Want to Read" selected>Keep Want to Read</option><option value="On Hold">On Hold</option><option value="Abandoned">Abandoned</option></select></div>
<div><label for="rr${b.id}">Reason for the delay</label><select id="rr${b.id}"><option value="">Choose a reason</option>${RS.map(s=>`<option>${s}</option>`).join("")}</select></div>
<div><label for="rn${b.id}">Note (required for Other)</label><input id="rn${b.id}" maxlength="100"></div></div><div class="err" id="re${b.id}" role="alert"></div><button class="btn s" data-r="${b.id}" type="button">Save review</button></article>`).join("")
:`<div class="card empty"><h3>Your backlog is clear</h3><p>No “Want to Read” book has waited longer than ${S.days} days.</p></div>`}`}
function reviewBind(){$$("[data-r]").forEach(x=>x.onclick=()=>{const id=+x.dataset.r,b=bks().find(y=>y.id===id),ns=$("#ns"+id).value,r=$("#rr"+id).value,n=$("#rn"+id).value.trim(),er=$("#re"+id);
if(!r){$("#rr"+id).focus();return er.textContent="Choose a reason before saving."}if(r==="Other"&&!n){$("#rn"+id).focus();return er.textContent="Write a short note for “Other”."}
b.log=b.log||[];b.log.push({d:today(),r,n,to:ns});b.status=ns;b.rev=today();if(ns==="Currently Reading"&&!b.start){b.start=today()}save();refresh();toast(ns==="Want to Read"?`Kept “${b.title}” as Want to Read. Reason saved: ${r==="Other"?n:r}.`:`“${b.title}” is now ${ns}. Reason saved: ${r==="Other"?n:r}.`)})}

function analysis(){const b=bks(),un=b.filter(x=>x.status==="Want to Read"),d=due(),cnt={};b.forEach(x=>(x.log||[]).forEach(l=>{const k=l.r==="Other"&&l.n?"Other: "+l.n:l.r;cnt[k]=(cnt[k]||0)+1}));
const rs=Object.entries(cnt).sort((a,z)=>z[1]-a[1]),mx=rs.length?rs[0][1]:1,items=ST.map((s,i)=>({l:s,n:b.filter(x=>x.status===s).length,c:SC[i]}));
const tips=[];if(d.length)tips.push(`${d.length} book${d.length>1?"s have":" has"} waited more than ${S.days} days. Open <a href="#review">Backlog Review</a> and decide on each one.`);
if(rs.length){const t=rs[0][0];tips.push({"Lack of Time":"Time is your top delay reason. Try a fixed 15-minute slot each day, or start with your shortest backlog book.","Too Difficult":"Difficulty is your top delay reason. Pair a hard book with an easier one, or look for a study guide.","Loss of Interest":"Interest is your top delay reason. It is fine to mark books you no longer want as Abandoned to keep the list honest.","Changed Priorities":"Changing priorities is your top delay reason. Move books that no longer matter to On Hold or Abandoned."}[t]||"Review the reasons below and decide which books still deserve your time.")}
const sh=[...un].sort((x,y)=>x.total-y.total)[0];if(sh)tips.push(`Quick win: “${esc(sh.title)}” is your shortest unread book at ${sh.total} pages.`);if(!tips.length)tips.push("Your backlog looks healthy. Keep adding books you are excited to read.");
return`<div class="kp"><div class="card kpi"><span class="ico"><i data-lucide="bookmark"></i></span><div><b>${un.length}</b><span>Total unread books</span></div></div><div class="card kpi"><span class="ico"><i data-lucide="history"></i></span><div><b>${d.length}</b><span>Over the ${S.days}-day limit</span></div></div><div class="card kpi"><span class="ico"><i data-lucide="clock"></i></span><div><b>${un.length?Math.max(...un.map(wait)):0}</b><span>Longest wait (days)</span></div></div></div>
<div class="g2"><div class="card"><h2>Books by status</h2><div style="display:flex;flex-wrap:wrap;gap:1rem;align-items:center">${donut(items)}<div class="lg" style="flex-direction:column">${items.map(i=>`<span><i class="sw" style="background:${i.c}"></i>${i.l}: <strong>${i.n}</strong></span>`).join("")}</div></div></div>
<div class="card"><h2>Most common reasons for delay</h2>${rs.length?rs.map(([k,n])=>`<div class="rb"><span>${esc(k)}</span><i style="width:${n/mx*100}%"></i><b>${n}</b></div>`).join(""):`<div class="empty">No reasons recorded yet. Review a backlogged book to start.</div>`}</div></div>
<div class="card"><h2>Recommendations</h2><ul style="margin:.3rem 0;padding-left:1.2rem">${tips.map(t=>`<li style="margin:.4rem 0">${t}</li>`).join("")}</ul></div>`}

function mapPage(){return`<div class="card" style="margin-bottom:1rem"><div class="tools"><div><label for="cs2">Explore a country</label><select id="cs2"></select></div><button class="btn g" id="zr" type="button">Reset map view</button></div>
<div id="map" aria-label="Interactive world map showing countries of authors you have completed"></div>
<div class="lg"><span><i class="sw" style="background:#b9c9bd"></i>No completed books</span><span><i class="sw" style="background:#cfe8da"></i>1 completed</span><span><i class="sw" style="background:#86c3a2"></i>2 completed</span><span><i class="sw" style="background:#2f7656"></i>3 or more</span></div>
<p class="hint" id="mapnote">Scroll, pinch or use + and − to zoom. Drag to move. Select a country to see its books.</p></div>
<div class="g2"><div class="card" id="cx" aria-live="polite"></div><div class="card" id="ex"></div></div>
<div class="card"><h2>Reading statistics by country</h2><div class="tw" id="cs"></div></div>`}
function mapData(){const cnt={};bks().filter(b=>b.status==="Completed").forEach(b=>cnt[b.cc]=(cnt[b.cc]||0)+1);return cnt}
function mapPanels(){const cnt=mapData(),nc=Object.keys(cnt).length;
$("#cs2").innerHTML=`<option value="">Choose a country</option>`+C.map(c=>`<option value="${c[0]}"${c[0]===sel?" selected":""}>${esc(c[1])}${cnt[c[0]]?" ("+cnt[c[0]]+" completed)":""}</option>`).join("");
if(!sel)$("#cx").innerHTML=`<h2>Country exploration</h2><p><strong>${nc}</strong> countr${nc===1?"y":"ies"} explored so far. Select a country on the map or from the list to see authors and completed books.</p>`;
